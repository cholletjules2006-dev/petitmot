<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petit Mot</title>
<!-- Icône et mode « app » sur iPhone (Partager > Sur l'écran d'accueil) -->
<link rel="apple-touch-icon" sizes="180x180" href="https://cholletjules2006-dev.github.io/petitmot/apple-touch-icon.png?v=2">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://cholletjules2006-dev.github.io/petitmot/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="512x512" href="https://cholletjules2006-dev.github.io/petitmot/icone-512.png?v=2">
<link rel="manifest" href="https://cholletjules2006-dev.github.io/petitmot/manifest.webmanifest?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Petit Mot">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)">
<style>
  :root { --fond: #f5f5f3; --texte: #1d1f23; --doux: #6e737b; --encre: #2f3b4c; }
  @media (prefers-color-scheme: dark) { :root { --fond: #141517; --texte: #ececea; --doux: #9a9da3; --encre: #e6e8eb; } }
  html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  /* Écran de lancement : le squelette de l'app (comme YouTube), le temps que Google réponde */
  :root { --carte: #fff; --ligne: #e4e4e0; --pale: #efefec; --reflet: #f8f8f6; --vert: #2f7a55; --vert-pale: #e6f2eb; }
  @media (prefers-color-scheme: dark) { :root { --carte: #1d1e21; --ligne: #2e3034; --pale: #2a2c30; --reflet: #34363b; --vert: #7cc39d; --vert-pale: #1d3027; } }
  #lancement { position: fixed; inset: 0; z-index: 2; background: var(--fond); overflow: hidden; transition: opacity .35s;
    padding: max(18px, env(safe-area-inset-top)) 16px 0; box-sizing: border-box; }
  #lancement.parti { opacity: 0; pointer-events: none; }
  .sq { max-width: 560px; margin: 0 auto; }
  .tete { display: flex; justify-content: space-between; align-items: flex-start; margin: 4px 2px 16px; }
  .tete h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.6px; line-height: 1.15; color: var(--texte); }
  .carte { background: var(--carte); border: 1px solid var(--ligne); border-radius: 16px; padding: 18px 16px; margin: 0 0 14px; }
  .bandeau { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .bloc { background: var(--pale); border-radius: 10px; position: relative; overflow: hidden; }
  .bloc::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, var(--reflet), transparent); animation: reflet 1.3s infinite; }
  @keyframes reflet { to { transform: translateX(100%); } }
  .vrai { font-size: 14px; line-height: 1.35; color: var(--texte); }
  .vrai b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--doux); }
  .serie { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 12px; background: var(--pale); display: flex; align-items: center;
    justify-content: center; font-weight: 800; font-size: 17px; color: var(--texte); }
  .serie.vive { background: var(--vert-pale); color: var(--vert); }
  .puce { width: 92px; height: 32px; border-radius: 99px; }
  .barre { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; background: var(--carte);
    border-top: 1px solid var(--ligne); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  .barre div { flex: 1; max-width: 140px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px 4px;
    font-size: 11px; font-weight: 600; color: var(--doux); }
  .barre div.on { color: var(--texte); }
  .barre svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #lent { position: fixed; left: 16px; right: 16px; bottom: calc(90px + env(safe-area-inset-bottom)); z-index: 3; text-align: center; }
  #lent p { margin: 0 0 10px; font-size: 14px; color: var(--doux); }
  #lent button { font: inherit; font-size: 15px; font-weight: 700; border: 0; border-radius: 999px; padding: 12px 22px;
    background: var(--encre); color: var(--fond); }
  .cache { display: none !important; }
</style>
</head>
<body>
<div id="lancement" aria-hidden="true">
  <div class="sq">
    <div class="tete">
      <div><h1>Petit Mot</h1><div class="bloc" style="width:150px;height:14px;margin-top:9px"></div></div>
      <div class="bloc puce"></div>
    </div>
    <div class="carte bandeau">
      <div class="serie" id="sqSerie"><div class="bloc" style="width:20px;height:16px"></div></div>
      <div class="vrai" style="flex:1" id="sqDefi"><div class="bloc" style="width:80px;height:10px;margin-bottom:8px"></div><div class="bloc" style="width:85%;height:13px"></div></div>
    </div>
    <div class="carte">
      <div class="bloc" style="height:42px;border-radius:12px;margin-bottom:14px"></div>
      <div class="bloc" style="height:120px;border-radius:14px"></div>
      <div style="display:flex;gap:6px;margin-top:10px">
        <div class="bloc" style="width:44px;height:34px;border-radius:99px"></div><div class="bloc" style="width:44px;height:34px;border-radius:99px"></div>
        <div class="bloc" style="width:44px;height:34px;border-radius:99px"></div><div class="bloc" style="width:96px;height:34px;border-radius:99px"></div>
      </div>
      <div class="bloc" style="width:70px;height:13px;margin:22px 0 10px"></div>
      <div class="bloc" style="aspect-ratio:4/3;border-radius:8px"></div>
    </div>
  </div>
  <div class="barre">
    <div class="on"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>Écrire</div>
    <div><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Mots</div>
    <div><svg viewBox="0 0 24 24"><path d="M12 21v-9"/><path d="M12 12c0-4 3-7 7-7 0 4-3 7-7 7z"/><path d="M12 15c0-3-2.5-5.5-6-5.5 0 3.5 2.5 5.5 6 5.5z"/></svg>Jeu</div>
    <div><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9.5h5M7 13h10"/></svg>Objet</div>
    <div><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Réglages</div>
  </div>
</div>
<div id="lent" class="cache">
  <p>Google met du temps à répondre…</p>
  <button id="reessayer">Réessayer</button>
</div>

<!-- Le vrai site (Google Apps Script), affiché en plein écran -->
<iframe id="app" title="Petit Mot" allow="clipboard-write"></iframe>

<script>
/* La page d'accueil garde la session et le dernier écran : Safari ne les garde pas pour le
   site Google affiché dans ce cadre. Elle ne répond qu'au site Petit Mot (origine Google). */
var SITE = 'https://script.google.com/macros/s/AKfycbw0udfEhmHZhj8lMmbkWIfF2ngnlaHuhXC2NGa6uZTuncu_vk9d_okwRYHMLN5S6p2s/exec';
var ORIGINE_SITE = /^https:\/\/n-[a-z0-9-]+-script\.googleusercontent\.com$/;
var K_JETON = 'petitmot_session', K_CACHE = 'petitmot_cache';
function lire(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function ecrire(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }

// Le squelette reprend ce qu'on sait du dernier lancement (série, défi du jour)
(function () {
  try {
    var c = JSON.parse(lire(K_CACHE) || 'null');
    if (!c || !c.jeu) return;
    var esc = function (t) { return String(t).replace(/[&<>"]/g, function (x) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[x]; }); };
    var serie = document.getElementById('sqSerie');
    serie.textContent = c.jeu.serie; serie.classList.toggle('vive', !!c.jeu.ecritAujourdhui);
    document.getElementById('sqDefi').innerHTML = '<b>Défi du jour</b>' + esc(c.jeu.defi);
  } catch (e) {}
})();

var pret = false, essais = 0, minuteur = null;
function charger() {
  essais++;
  pret = false;
  document.getElementById('app').src = SITE + (essais > 1 ? (SITE.indexOf('?') < 0 ? '?' : '&') + 'r=' + Date.now() : '');
  clearTimeout(minuteur);
  // Pas de réponse au bout de 12 s : on relance tout seul une fois, puis on propose de réessayer
  minuteur = setTimeout(function () {
    if (pret) return;
    if (essais < 2) { charger(); return; }
    document.getElementById('lent').classList.remove('cache');
  }, 12000);
}
document.getElementById('reessayer').onclick = function () {
  essais = 0;
  document.getElementById('lent').classList.add('cache');
  charger();
};

window.addEventListener('message', function (e) {
  if (!ORIGINE_SITE.test(e.origin) || !e.data || typeof e.data.type !== 'string') return;
  var d = e.data;
  if (d.type === 'petitmot-demande') {
    e.source.postMessage({ type: 'petitmot-donnees', token: lire(K_JETON), cache: lire(K_CACHE) }, e.origin);
  } else if (d.type === 'petitmot-jeton' && typeof d.token === 'string' && d.token.length < 200) {
    ecrire(K_JETON, d.token);
  } else if (d.type === 'petitmot-cache' && typeof d.cache === 'string' && d.cache.length < 400000) {
    ecrire(K_CACHE, d.cache);
  } else if (d.type === 'petitmot-oubli') {
    ecrire(K_JETON, null); ecrire(K_CACHE, null);
  } else if (d.type === 'petitmot-pret') {
    pret = true; clearTimeout(minuteur);
    document.getElementById('lancement').classList.add('parti');
    document.getElementById('lent').classList.add('cache');
  }
});
charger();
</script>
</body>
</html>
